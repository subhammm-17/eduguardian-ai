<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EduGuardian AI</title>

  <!-- Font: Plus Jakarta Sans (from Google Fonts) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Libraries (loaded from a CDN, so you need internet) -->
  <!-- marked: turns Markdown (###, **bold**, lists) into HTML -->
  <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
  <!-- DOMPurify: removes anything unsafe from the HTML before we show it -->
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
  <!-- KaTeX: draws maths like $x^2$ and $$...$$ -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>

  <link rel="stylesheet" href="styles.css">
  <script src="config.js"></script>
  <!-- Not logged in? Go to the login page before anything shows. -->
  <script>if (!getToken()) location.replace("login.html");</script>
</head>
<body>
  <!-- ===== Top bar ===== -->
  <header class="topbar">
    <div class="brand">
      <div class="logo">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l7 3v6c0 4.4-3 7.8-7 9-4-1.2-7-4.6-7-9V6l7-3z"/><path d="M9 12l2 2 4-4"/></svg>
      </div>
      <span class="brand-name">EduGuardian AI</span>
    </div>
    <div class="user-box">
      <span class="status" id="status"><span class="status-text">Checking server...</span></span>
      <div class="avatar" id="avatar">?</div>
      <span class="user-name" id="userName"></span>
      <button class="btn btn-ghost btn-small" id="logoutBtn" type="button">Log out</button>
    </div>
  </header>

  <main class="app">
    <section class="greeting">
      <h1 id="greeting">Hi there 👋</h1>
      <p>Pick a subject and ask your doubt. Answers come step by step.</p>
    </section>

    <!-- data-subject must match the keys in SUBJECT_PROMPTS in backend/main.py -->
    <nav class="subjects" aria-label="Subject">
      <button class="subject active" data-subject="maths" type="button">
        <div class="s-icon">∑</div>
        <div><strong>Mathematics</strong><span>Solving + exact graphs</span></div>
      </button>
      <button class="subject" data-subject="digital_logic" type="button">
        <div class="s-icon">⊕</div>
        <div><strong>Digital Logic</strong><span>Boolean algebra, truth tables</span></div>
      </button>
      <button class="subject" data-subject="quantum" type="button">
        <div class="s-icon">⚛</div>
        <div><strong>Quantum Computing</strong><span>Qubits and circuits, simply</span></div>
      </button>
    </nav>

    <!-- Shown until the first question is asked -->
    <section class="welcome" id="welcome">
      <p>Not sure where to start? Try one of these:</p>
      <div class="examples" id="examples"></div>
    </section>

    <!-- Questions and answers appear here -->
    <section class="thread" id="thread" aria-live="polite"></section>

    <!-- ===== Question box ===== -->
    <div class="composer-wrap">
      <form class="composer" id="composer">
        <textarea id="question" rows="2" placeholder="Type your doubt here, e.g. Solve x^2 - 5x + 6 = 0"></textarea>
        <div class="composer-row">
          <div class="model-picks">
            <label class="mini-select"><span class="mini-label">Model</span>
              <select id="model">
                <option value="gemini-3.8-flash">gemini-3.8-flash</option>
                <option value="__other__">Other (type a name)</option>
              </select>
            </label>
            <label class="mini-select" id="customModelLabel" hidden>
              <input id="customModel" type="text" placeholder="Model name">
            </label>
            <label class="mini-select" title="Answers instead if the main model fails or is too slow"><span class="mini-label">Backup</span>
              <select id="backupModel">
                <option value="llama-3.3-70b-versatile">llama-3.3-70b</option>
                <option value="openai/gpt-oss-120b">gpt-oss-120b</option>
                <option value="llama-3.1-8b-instant">llama-3.1-8b (fastest)</option>
              </select>
            </label>
          </div>
          <div class="model-picks">
            <span class="send-hint">Ctrl + Enter</span>
            <button class="btn btn-primary" id="askBtn" type="submit">Ask</button>
          </div>
        </div>
      </form>
    </div>
  </main>

  <script>
    const ASK_URL = API_BASE + "/ask/stream";  // sends the answer piece by piece
    const PLOT_URL = API_BASE + "/plot";       // draws a graph for maths questions (no AI)

    // Example questions shown as clickable chips for each subject
    const EXAMPLES = {
      maths: ["Solve x^2 - 5x + 6 = 0", "Differentiate sin(x) * e^x", "Integrate 1/(1+x^2)"],
      digital_logic: ["Simplify A'B + AB + AB'", "Truth table for (A + B)C", "What is a K-map?"],
      quantum: ["What is a qubit?", "Explain the Hadamard gate", "What is entanglement?"],
    };
    const SUBJECT_NAMES = { maths: "Mathematics", digital_logic: "Digital Logic", quantum: "Quantum Computing" };

    let subject = "maths";
    let busy = false;

    const $ = (id) => document.getElementById(id);
    const questionEl = $("question");
    const askBtn = $("askBtn");
    const threadEl = $("thread");
    const modelEl = $("model");
    const customModelEl = $("customModel");

    // ---- Logged-in user ----
    const user = getUser() || { name: "", email: "" };
    const firstName = (user.name || "").split(" ")[0];
    $("greeting").textContent = firstName ? "Hi " + firstName + " 👋" : "Hi there 👋";
    $("userName").textContent = user.name || user.email;
    $("avatar").textContent = (user.name || user.email || "?").trim().charAt(0).toUpperCase();

    function goToLogin() {
      clearLogin();
      location.replace("login.html");
    }

    $("logoutBtn").addEventListener("click", async () => {
      try {
        await fetch(API_BASE + "/auth/logout", { method: "POST", headers: { Authorization: "Bearer " + getToken() } });
      } catch (e) {}
      goToLogin();
    });

    // Check the login is still valid, and whether the server has its keys
    (async () => {
      const statusEl = $("status");
      const statusText = statusEl.querySelector(".status-text");
      try {
        const me = await fetch(API_BASE + "/auth/me", { headers: { Authorization: "Bearer " + getToken() } });
        if (me.status === 401) return goToLogin();
        const health = await (await fetch(API_BASE + "/")).json();
        const ready = health.gemini_ready || health.backup_ready;
        statusEl.className = "status " + (ready ? "ok" : "bad");
        statusText.textContent = ready ? (health.backup_ready ? "Ready · backup on" : "Ready") : "Server has no API keys";
        statusEl.title = ready ? "The server is running" : "Add GEMINI_API_KEY to backend/.env and restart uvicorn";
      } catch (e) {
        statusEl.className = "status bad";
        statusText.textContent = "Server offline";
        statusEl.title = "Start the backend: uvicorn main:app --reload";
      }
    })();

    // ---- Subject buttons ----
    document.querySelectorAll(".subject").forEach((btn) => {
      btn.addEventListener("click", () => {
        document.querySelectorAll(".subject").forEach((b) => b.classList.remove("active"));
        btn.classList.add("active");
        subject = btn.dataset.subject;
        showExamples();
        questionEl.focus();
      });
    });

    function showExamples() {
      const box = $("examples");
      box.innerHTML = "";
      EXAMPLES[subject].forEach((text) => {
        const chip = document.createElement("button");
        chip.type = "button";
        chip.className = "chip";
        chip.textContent = text;
        chip.addEventListener("click", () => { questionEl.value = text; ask(); });
        box.appendChild(chip);
      });
    }
    showExamples();

    // Show the "type a model name" box when "Other" is picked
    modelEl.addEventListener("change", () => {
      $("customModelLabel").hidden = modelEl.value !== "__other__";
      if (modelEl.value === "__other__") customModelEl.focus();
    });
    function chosenModel() {
      return modelEl.value === "__other__" ? customModelEl.value.trim() : modelEl.value;
    }

    // Grow the question box as you type
    questionEl.addEventListener("input", () => {
      questionEl.style.height = "auto";
      questionEl.style.height = questionEl.scrollHeight + "px";
    });

    // ---- Turn the Markdown + LaTeX answer into nice HTML ----
    // Step 1: pull out the maths ($$...$$ and $...$) and put placeholders in its place,
    //         so the Markdown step does not break backslashes and underscores.
    // Step 2: convert the Markdown to HTML with marked (cleaned by DOMPurify).
    // Step 3: put the maths back, drawn by KaTeX.
    function renderAnswer(text) {
      const maths = [];
      const keep = (tex, display) => {
        maths.push({ tex, display });
        return "@@MATH" + (maths.length - 1) + "@@";
      };

      const safe = text
        .replace(/\$\$([\s\S]+?)\$\$/g, (_, tex) => keep(tex, true))   // $$ display $$
        .replace(/\\\[([\s\S]+?)\\\]/g, (_, tex) => keep(tex, true))     // \[ display \]
        .replace(/\\\(([\s\S]+?)\\\)/g, (_, tex) => keep(tex, false))    // \( inline \)
        .replace(/\$([^\$\n]+?)\$/g, (_, tex) => keep(tex, false));      // $ inline $

      const html = DOMPurify.sanitize(marked.parse(safe));

      return html.replace(/@@MATH(\d+)@@/g, (_, i) => {
        const m = maths[Number(i)];
        try {
          return katex.renderToString(m.tex.trim(), { displayMode: m.display, throwOnError: false });
        } catch (e) {
          return m.tex;
        }
      });
    }

    // ---- Build one question + answer pair on the page ----
    function el(tag, className, text) {
      const node = document.createElement(tag);
      if (className) node.className = className;
      if (text !== undefined) node.textContent = text;
      return node;
    }

    function addTurn(question) {
      $("welcome").hidden = true;
      threadEl.appendChild(el("div", "question-bubble", question));

      const card = el("article", "answer-card");
      const head = el("div", "answer-head");
      const tags = el("div", "tags");
      const copyBtn = el("button", "btn btn-ghost btn-small", "Copy");
      copyBtn.type = "button";
      copyBtn.hidden = true;
      head.append(tags, copyBtn);

      const body = el("div", "answer-body");
      const thinking = el("div", "thinking");
      thinking.innerHTML = '<span class="dots"><span></span><span></span><span></span></span>';
      const thinkingText = el("span", "", "Thinking...");
      thinking.appendChild(thinkingText);
      body.appendChild(thinking);

      card.append(head, body);
      threadEl.appendChild(card);
      card.scrollIntoView({ behavior: "smooth", block: "start" });

      const turn = { card, tags, body, copyBtn, thinkingText, text: "" };
      copyBtn.addEventListener("click", async () => {
        try {
          await navigator.clipboard.writeText(turn.text);
          copyBtn.textContent = "Copied!";
        } catch (e) {
          copyBtn.textContent = "Copy failed";
        }
        setTimeout(() => (copyBtn.textContent = "Copy"), 1500);
      });
      return turn;
    }

    function addTag(turn, text, className) {
      turn.tags.appendChild(el("span", className || "tag", text));
    }

    function showError(turn, message) {
      turn.body.innerHTML = "";
      turn.body.appendChild(el("div", "error", message));
    }

    // ---- Graph under maths answers ----
    async function loadGraph(turn, question) {
      try {
        const res = await fetch(PLOT_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json", Authorization: "Bearer " + getToken() },
          body: JSON.stringify({ question }),
        });
        if (!res.ok) return;
        const data = await res.json();
        if (!data.image) return;  // nothing to draw, e.g. "What is a matrix?"
        const fig = el("figure", "graph");
        fig.appendChild(el("p", "graph-title", "Graph"));
        const img = el("img");
        img.src = "data:image/png;base64," + data.image;
        img.alt = "Graph of the function in the question";
        fig.appendChild(img);
        if (data.caption) fig.appendChild(el("figcaption", "", data.caption));
        turn.card.appendChild(fig);
      } catch (e) {
        // No graph is fine: the written answer still shows
      }
    }

    // ---- Send the question to the backend ----
    async function ask() {
      const question = questionEl.value.trim();
      const model = chosenModel();
      if (busy || !question) return questionEl.focus();
      if (!model) return customModelEl.focus();

      busy = true;
      askBtn.disabled = true;
      questionEl.value = "";
      questionEl.style.height = "auto";

      const turn = addTurn(question);
      const askedSubject = subject;
      if (askedSubject === "maths") loadGraph(turn, question);  // runs alongside the answer

      // A seconds counter, so you can see how long the model takes
      const started = Date.now();
      const seconds = () => ((Date.now() - started) / 1000).toFixed(1);
      const timer = setInterval(() => { turn.thinkingText.textContent = "Thinking... " + seconds() + "s"; }, 100);

      try {
        const res = await fetch(ASK_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json", Authorization: "Bearer " + getToken() },
          body: JSON.stringify({ subject: askedSubject, model, question, backup_model: $("backupModel").value }),
        });

        if (res.status === 401) return goToLogin();  // login expired
        if (!res.ok) return showError(turn, await errorMessage(res));

        addTag(turn, SUBJECT_NAMES[askedSubject] || askedSubject);
        // The backend tells us which model answered (the backup, if Gemini failed)
        const answeredBy = res.headers.get("X-Answered-By") || model;
        addTag(turn, answeredBy);
        if (answeredBy !== model) addTag(turn, "Backup used", "tag backup");
        const timeTag = el("span", "tag");
        turn.tags.appendChild(timeTag);

        // Read the answer piece by piece and redraw it as it grows
        const reader = res.body.getReader();
        const decoder = new TextDecoder();
        let drawPending = false;
        while (true) {
          const { done, value } = await reader.read();
          if (done) break;
          turn.text += decoder.decode(value, { stream: true });
          if (!drawPending) {
            drawPending = true;
            requestAnimationFrame(() => {
              turn.body.innerHTML = renderAnswer(turn.text);
              drawPending = false;
            });
          }
        }
        turn.text += decoder.decode();
        turn.body.innerHTML = renderAnswer(turn.text);
        timeTag.textContent = "⏱ " + seconds() + "s";
        turn.copyBtn.hidden = false;
      } catch (err) {
        showError(turn, "Could not reach the backend. Is uvicorn running at " + API_BASE + " ?");
      } finally {
        clearInterval(timer);
        busy = false;
        askBtn.disabled = false;
        questionEl.focus();
      }
    }

    $("composer").addEventListener("submit", (e) => { e.preventDefault(); ask(); });
    questionEl.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && e.ctrlKey) { e.preventDefault(); ask(); }
    });
    questionEl.focus();
  </script>
</body>
</html>
